name: Docker Lint

on:
  push:
    paths:
      - 'docker/**'
      # O proprio workflow entra no filtro: mudar as regras do linter sem
      # reexecutar o linter deixa a configuracao nova sem verificacao nenhuma.
      - '.github/workflows/docker-lint.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-lint.yml'

  # Execucao manual, para conferir uma mudanca de regra sem precisar inventar
  # um commit em docker/ so para disparar o gatilho.
  workflow_dispatch:

jobs:
  docker-lint:
    runs-on: ubuntu-latest

    steps:
      # Faz o checkout do repositório para que os arquivos docker/ fiquem disponíveis
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Executa o hadolint para análise estática do Dockerfile e verifica boas práticas.
      #
      # Duas regras estão suprimidas, e as duas pelo mesmo motivo: o CHALLENGE.md
      # proíbe alterar o docker/Dockerfile, então não há como agir sobre o que elas
      # apontam. Suprimir aqui é honesto; o contrário seria um pipeline vermelho
      # permanente por algo que o aluno não pode corrigir.
      #
      #   DL3008 (warning) — "Pin versions in apt get install". Fixar a versão de
      #   cada pacote apt quebraria o build assim que a imagem base atualizasse os
      #   repositórios, que é justamente o que uma imagem de ensino não quer.
      #
      #   DL3059 (info) — "Multiple consecutive RUN instructions". Consolidar os RUN
      #   exigiria reescrever o Dockerfile, e as camadas separadas existem ali para
      #   o aluno ler cada etapa isoladamente.
      #
      # Qualquer achado de nível error continua derrubando o job.
      - name: Lint do Dockerfile com hadolint
      # A imagem hadolint/hadolint traz o hadolint como COMANDO padrao, nao como
      # entrypoint. Passar argumentos substitui o comando inteiro, entao o nome da
      # ferramenta precisa ser repetido — sem isso o Docker tenta executar
      # `--ignore` como binario e sai com 127.
        run: docker run --rm -i hadolint/hadolint hadolint --ignore DL3008 --ignore DL3059 - < docker/Dockerfile

      # Valida a sintaxe e a integridade do docker-compose.yml sem subir os serviços
      # TODO: se você tiver um ambiente de testes disponível, pode estender este step
      #       executando `docker compose -f docker/docker-compose.yml up --build -d`
      #       seguido de verificações de health e `docker compose down` ao final
      - name: Validar docker-compose.yml
        run: docker compose -f docker/docker-compose.yml config --quiet
