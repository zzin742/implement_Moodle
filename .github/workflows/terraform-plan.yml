# ATENÇÃO: Este workflow requer credenciais AWS REAIS para executar com sucesso.
#
# O terraform plan deste projeto consulta data sources (aws_ami e aws_iam_instance_profile)
# que fazem chamadas à API da AWS. Sem credenciais válidas, o workflow falha no PLAN, não no init.
#
# Secrets obrigatórios:
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
#   - AWS_SESSION_TOKEN (obrigatório no AWS Academy Learner Lab - credenciais STS temporárias)
#   - TF_VAR_ec2_public_key (chave SSH pública)
#   - TF_VAR_db_username (usuário do banco)
#   - TF_VAR_db_password (senha do banco)
#   - TF_VAR_moodle_admin_password (senha do admin do Moodle)
#   - TF_VAR_ssh_allowed_cidr (CIDR permitido para SSH, ex: "203.0.113.45/32")
#
# Abordagem escolhida: variáveis via TF_VAR_* secrets
# Por quê: Secrets são mais seguros que arquivos .tfvars.ci commitados ou gerados dinamicamente
# no workflow (que podem vazar em logs). TF_VAR_* é lido automaticamente pelo Terraform sem
# necessidade de -var ou -var-file explícitos.
#
# POR QUE APENAS workflow_dispatch (sem push/pull_request automáticos):
# As credenciais do AWS Academy Learner Lab expiram em 4 horas. Com gatilhos automáticos em
# push ou pull_request, qualquer commit que toque terraform/** dispararia um plan que falha
# na autenticação, porque os secrets AWS estarão vencidos quase sempre (uma sessão do Lab dura
# 4h, mas commits acontecem o tempo todo). O resultado seria um workflow cronicamente vermelho
# por motivo que não tem relação com a qualidade do código.
#
# Com workflow_dispatch apenas, o plan roda quando o operador atualiza os secrets com credenciais
# frescas do portal AWS Academy e dispara manualmente — que é o único momento em que ele pode
# funcionar. Esta escolha é deliberada e adequada ao ambiente educacional do Learner Lab.

name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      terraform_dir:
        description: 'Diretório do Terraform a validar'
        required: false
        default: 'terraform'
        type: string

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ inputs.terraform_dir || 'terraform' }}
      
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ${{ inputs.terraform_dir || 'terraform' }}
        env:
          TF_VAR_ec2_public_key: ${{ secrets.TF_VAR_ec2_public_key }}
          TF_VAR_db_username: ${{ secrets.TF_VAR_db_username }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_moodle_admin_password: ${{ secrets.TF_VAR_moodle_admin_password }}
          TF_VAR_ssh_allowed_cidr: ${{ secrets.TF_VAR_ssh_allowed_cidr }}
      
      - name: Resumo do Plan
        run: |
          echo "## Terraform Plan" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ inputs.terraform_dir || 'terraform' }}
